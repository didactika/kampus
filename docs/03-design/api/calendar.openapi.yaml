openapi: 3.1.0
info:
  title: Kampus calendar API (design fragment)
  version: 0.1.0
  description: >-
    Entries, the calendar view with recurrences expanded and activity dates (RN-156 to RN-158),
    subscriptions (RN-159) and personal feeds (RN-161). Conventions of DEC-025 and DEC-026.
paths:
  /api/v1/calendar/entries:
    get: { summary: 'The entries of a scope that touch a window, or the personal ones when no scope is given', parameters: [{ name: scope, in: query, schema: { type: string, format: uuid } }, { name: from, in: query, required: true, schema: { type: string, format: date-time } }, { name: to, in: query, required: true, schema: { type: string, format: date-time } }], responses: { '200': { description: Items }, '422': { description: Empty window or longer than a year } } }
    post: { summary: 'Create an entry in a scope (calendar.manage) or a personal one when no scope is given', responses: { '201': { description: Created } } }
  /api/v1/calendar/entries/{entry_id}:
    get: { summary: An entry the caller sees, responses: { '200': { description: The entry } } }
    put: { summary: Replace an entry on the version it was read at, parameters: [{ $ref: '#/components/parameters/IfMatch' }], responses: { '200': { description: Changed } } }
    delete: { summary: Delete an entry, responses: { '204': { description: Deleted } } }
  /api/v1/calendar/courses/{course_id}/calendar:
    get: { summary: 'The entries of a course and the dates of its activities, with the exceptions of the caller applied (RN-157)', parameters: [{ name: from, in: query, required: true, schema: { type: string, format: date-time } }, { name: to, in: query, required: true, schema: { type: string, format: date-time } }], responses: { '200': { description: Items } } }
  /api/v1/calendar/entries/{entry_id}/occurrences/{occurrence_at}:
    put: { summary: 'Cancel or change one occurrence of a recurring entry, named by when its rule starts it', responses: { '204': { description: Set }, '422': { description: 'Not one of its occurrences' } } }
    delete: { summary: 'Take back the change of one occurrence', responses: { '204': { description: Restored } } }
  /api/v1/calendar/scopes/{scope_id}/subscriptions:
    get: { summary: 'The calendars a scope subscribes to (calendar.manage)', responses: { '200': { description: Subscriptions } } }
    post: { summary: 'Subscribe a scope to a calendar of another system, over http or https at a public address (RN-159)', responses: { '201': { description: Subscribed }, '422': { description: 'An address, a title or a refresh that does not fit' } } }
  /api/v1/calendar/subscriptions/{subscription_id}:
    delete: { summary: 'Remove a subscription with its events', responses: { '204': { description: Removed } } }
  /api/v1/calendar/subscriptions/{subscription_id}/refresh:
    post: { summary: 'Read the calendar again now, with how many events were added, changed and removed', responses: { '200': { description: Read } } }
  /api/v1/calendar/feeds:
    get: { summary: 'The personal feeds of the caller', responses: { '200': { description: Feeds } } }
    post: { summary: 'Make a personal feed; its secret address is shown once (RN-161)', responses: { '201': { description: 'The feed, its secret and its address' } } }
  /api/v1/calendar/feeds/{feed_id}:
    delete: { summary: 'Revoke a personal feed', responses: { '204': { description: Revoked } } }
  /api/v1/calendar/feed/{secret}:
    get: { summary: 'The calendar of a feed, as iCalendar, for the application that holds its secret address', responses: { '200': { description: 'text/calendar' }, '404': { description: 'Unknown or revoked' } } }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    After: { name: after, in: query, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
