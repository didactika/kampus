openapi: 3.1.0
info:
  title: Kampus calendar API (design fragment)
  version: 0.1.0
  description: >-
    Entries, the calendar view with recurrences expanded and activity dates (RN-156 to RN-158),
    subscriptions (RN-159) and personal feeds (RN-161). Conventions of DEC-025 and DEC-026.
paths:
  /api/v1/calendar:
    get: { summary: 'Occurrences in a range for the caller, with activity dates and exceptions applied', parameters: [{ name: from, in: query, required: true, schema: { type: string, format: date-time } }, { name: to, in: query, required: true, schema: { type: string, format: date-time } }], responses: { '200': { description: Occurrences } } }
  /api/v1/scopes/{scope_id}/calendar-entries:
    post: { summary: Create an entry in a scope, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created } } }
  /api/v1/calendar-entries/{entry_id}:
    patch: { summary: Change an entry, parameters: [{ $ref: '#/components/parameters/IfMatch' }], responses: { '200': { description: Changed } } }
    delete: { summary: Delete an entry, responses: { '204': { description: Deleted } } }
  /api/v1/calendar-entries/{entry_id}/exceptions/{occurrence_at}:
    put: { summary: Cancel or change one occurrence, responses: { '200': { description: Set } } }
  /api/v1/scopes/{scope_id}/calendar-subscriptions:
    post: { summary: 'Subscribe to an external calendar (RN-159)', responses: { '201': { description: Subscribed } } }
  /api/v1/calendar-subscriptions/{subscription_id}/refresh:
    post: { summary: Queue a refresh, responses: { '202': { description: Queued } } }
  /api/v1/calendar-feeds:
    post: { summary: 'Create a personal feed token; shown once (RN-161)', responses: { '201': { description: Token and feed URL } } }
  /api/v1/calendar-feeds/{feed_id}:
    delete: { summary: Revoke a feed token, responses: { '204': { description: Revoked } } }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    After: { name: after, in: query, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
