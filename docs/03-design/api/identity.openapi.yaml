openapi: 3.1.0
info:
  title: Kampus identity and users API (design fragment)
  version: 0.1.0
  description: >-
    Sign-in, sign-up, recovery, second factors, sessions, API tokens, accounts and their lifecycle,
    identity providers, profiles, custom profile fields and system groups. Conventions of DEC-025 and
    DEC-026; permissions checked inside every operation (DEC-017). Answers to sign-in and recovery never
    reveal whether an account exists (RN-027).
paths:
  /api/v1/auth/sign-in:
    post: { summary: 'Sign in with username or email and password, or a passkey assertion (RN-024)', responses: { '200': { description: 'Signed in, or a second factor is required' }, '401': { description: Invalid credentials }, '429': { description: Throttled } } }
  /api/v1/auth/second-factor:
    post: { summary: Complete sign-in with a second factor or a recovery code, responses: { '200': { description: Signed in } } }
  /api/v1/auth/oidc/{provider_id}/start:
    get: { summary: Start sign-in with an identity provider, responses: { '302': { description: Redirect to the provider } } }
  /api/v1/auth/oidc/{provider_id}/callback:
    get: { summary: 'Finish sign-in; links by issuer and subject (RN-028)', responses: { '302': { description: Signed in, or confirmation of linking required } } }
  /api/v1/auth/step-up:
    post: { summary: 'Re-authenticate for a sensitive operation (RN-032)', responses: { '200': { description: Strong authentication renewed } } }
  /api/v1/auth/sign-out:
    post: { summary: Sign out this session, responses: { '204': { description: Signed out } } }
  /api/v1/auth/sign-up:
    post: { summary: 'Self sign-up when the campus allows it (UC-006)', parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '202': { description: Confirmation link sent } } }
  /api/v1/auth/confirm:
    post: { summary: Confirm an email or accept an invitation with a one-time token, then set a password, responses: { '200': { description: Confirmed } } }
  /api/v1/auth/recovery:
    post: { summary: 'Request account recovery (rate-limited, RN-030)', responses: { '202': { description: Accepted, whether or not the account exists } } }
  /api/v1/auth/recovery/complete:
    post: { summary: 'Complete recovery: token, then second factor or recovery code, then the new credential', responses: { '200': { description: Credential changed; sessions revoked; not signed in } } }
  /api/v1/me/sessions:
    get: { summary: My sessions, responses: { '200': { description: A page of sessions } } }
    delete: { summary: Revoke all my other sessions, responses: { '204': { description: Revoked } } }
  /api/v1/me/second-factors:
    get: { summary: My second factors, responses: { '200': { description: Second factors } } }
    post: { summary: 'Add a second factor (step-up required)', responses: { '201': { description: Added, with recovery codes shown once } } }
  /api/v1/me/second-factors/{factor_id}:
    delete: { summary: 'Remove a second factor (step-up required)', responses: { '204': { description: Removed } } }
  /api/v1/me/tokens:
    get: { summary: My API tokens (prefix, scopes, expiry, last use), responses: { '200': { description: A page of tokens } } }
    post: { summary: 'Create an API token; the secret is shown once (RN-033)', parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created } } }
  /api/v1/me/tokens/{token_id}:
    delete: { summary: Revoke a token, responses: { '204': { description: Revoked } } }
  /api/v1/me/profile:
    get: { summary: My profile with the fields I can see, responses: { '200': { description: Profile } } }
    patch: { summary: Update my profile, parameters: [{ $ref: '#/components/parameters/IfMatch' }], responses: { '200': { description: Updated } } }
  /api/v1/campuses/{campus_id}/accounts:
    get: { summary: 'Accounts of a campus, filtered by permission before paging', parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }], responses: { '200': { description: A page of accounts } } }
    post: { summary: Invite a person (a set-password link is sent; no password is generated), parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Invited } } }
  /api/v1/campuses/{campus_id}/accounts/bulk:
    post: { summary: 'Bulk invite, suspend or delete from a file; runs as a job with a per-row report (RN-038)', responses: { '202': { description: Job accepted } } }
  /api/v1/accounts/{account_id}/transitions:
    post:
      summary: 'Change the status: suspend, reactivate, schedule deletion, cancel deletion (RN-023)'
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Transition' } } } }
      responses: { '200': { description: Changed; sessions and tokens revoked when suspending or deleting }, '409': { description: Transition not allowed from the current status } }
  /api/v1/accounts/{account_id}/profile:
    get: { summary: 'A profile, with only the fields the caller may see (RN-036)', responses: { '200': { description: Profile } } }
    patch: { summary: Update a profile, parameters: [{ $ref: '#/components/parameters/IfMatch' }], responses: { '200': { description: Updated } } }
  /api/v1/campuses/{campus_id}/identity-providers:
    get: { summary: Identity providers of a campus, responses: { '200': { description: Providers } } }
    post: { summary: 'Add an OIDC provider with its linking policy', responses: { '201': { description: Added } } }
  /api/v1/scopes/{scope_id}/profile-fields:
    get: { summary: Custom profile fields defined in a campus or category, responses: { '200': { description: Fields } } }
    post: { summary: Define a custom profile field, responses: { '201': { description: Defined } } }
  /api/v1/scopes/{scope_id}/system-groups:
    get: { summary: System groups of a campus or category, responses: { '200': { description: A page of groups } } }
    post: { summary: Create a manual or rule-based system group, responses: { '201': { description: Created } } }
  /api/v1/system-groups/{group_id}/members:
    get: { summary: Members with their origin, responses: { '200': { description: A page of members } } }
    post: { summary: Add members by hand, responses: { '201': { description: Added } } }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    After: { name: after, in: query, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string } }
  schemas:
    Transition:
      type: object
      required: [to, reason]
      properties:
        to: { enum: [suspended, active, deletion_scheduled, deletion_cancelled] }
        reason: { type: string }
