openapi: 3.1.0
info:
  title: Kampus notifications and messaging API (design fragment)
  version: 0.1.0
  description: >-
    Inbox, preferences per type and channel (RN-148, RN-147), conversations, messages, deletions and blocks
    (RN-152 to RN-155). Conventions of DEC-025 and DEC-026.
paths:
  /api/v1/notify/inbox:
    get: { summary: 'The inbox of the caller, newest first, with the count of unread', parameters: [{ name: unread, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }], responses: { '200': { description: A page } } }
  /api/v1/notify/inbox/{notification_id}/read:
    post: { summary: Mark a notification read, responses: { '200': { description: Marked } } }
  /api/v1/notify/inbox/read-all:
    post: { summary: Mark every notification read, responses: { '200': { description: How many changed } } }
  /api/v1/notify/preferences:
    get: { summary: 'What the caller receives of each declared type on each channel, inbox, email and push, with what the campus locked (RN-148)', responses: { '200': { description: Preferences } } }
  /api/v1/notify/preferences/{type}/{channel}:
    put: { summary: 'Turn a type on or off on a channel; the inbox of a required type and what the campus locked cannot change', responses: { '200': { description: Set }, '409': { description: Locked by the campus } } }
  /api/v1/notify/campuses/{campus_id}/templates:
    get: { summary: 'The templates of email and push of a campus (notify.template.manage)', responses: { '200': { description: Templates } } }
    put: { summary: 'Write the template of a type, a channel and a language (RN-150)', responses: { '200': { description: Written } } }
  /api/v1/notify/campuses/{campus_id}/templates/{type}/{channel}/{locale}:
    delete: { summary: 'Remove a template; the summary of the type is sent again', responses: { '204': { description: Removed } } }
  /api/v1/notify/campuses/{campus_id}/defaults:
    get: { summary: 'What the campus gives by default for each type and channel (notify.defaults.manage)', responses: { '200': { description: Defaults } } }
    put: { summary: 'Set the default of a type on a channel, locked or not', responses: { '200': { description: Set } } }
  /api/v1/notify/push-key:
    get: { summary: 'The public key browsers subscribe with (applicationServerKey)', responses: { '200': { description: 'The key, P-256 in base64url' }, '404': { description: 'The installation sends no push notifications' } } }
  /api/v1/notify/push-subscriptions:
    get: { summary: 'The browsers and phones of the caller that receive push notifications', responses: { '200': { description: Subscriptions } } }
    post: { summary: 'Register a browser or phone, by the endpoint and keys its push service gives', responses: { '201': { description: Registered } } }
  /api/v1/notify/push-subscriptions/{subscription_id}:
    delete: { summary: 'Remove a browser or phone', responses: { '204': { description: Removed } } }
  /api/v1/notify/conversations:
    get: { summary: The caller's conversations, parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }], responses: { '200': { description: A page } } }
    post: { summary: 'Open a direct or group conversation; a direct one is unique per pair (RN-152)', parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created }, '200': { description: Already exists } } }
  /api/v1/notify/conversations/{conversation_id}/messages:
    get: { summary: Messages not deleted by the caller, parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/After' }], responses: { '200': { description: A page } } }
    post: { summary: 'Send a message, refused when blocked or not allowed (RN-153)', parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Sent }, '403': { description: Not allowed } } }
  /api/v1/notify/messages/{message_id}:
    delete: { summary: 'Delete for the caller; purged when every member deleted it (RN-154)', responses: { '204': { description: Deleted } } }
  /api/v1/notify/blocks/{account_id}:
    put: { summary: Block an account, responses: { '204': { description: Blocked } } }
    delete: { summary: Unblock, responses: { '204': { description: Unblocked } } }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    After: { name: after, in: query, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
