openapi: 3.1.0
info:
  title: Kampus privacy API (design fragment)
  version: 0.1.0
  description: >-
    Data requests (RN-179 to RN-183), legal holds (RN-182), retention rules (RN-184) and policies with
    acceptances (RN-185). Conventions of DEC-025 and DEC-026.
paths:
  /api/v1/privacy/requests:
    get: { summary: The requests the caller made, responses: { '200': { description: Requests } } }
    post: { summary: 'Ask for an export of the data of the caller, or of another account with privacy.request.manage', responses: { '202': { description: Accepted; a job asks each module for its part } } }
  /api/v1/privacy/requests/{request_id}:
    get: { summary: A request with its parts per data category, responses: { '200': { description: Request } } }
  /api/v1/privacy/requests/{request_id}/package:
    get: { summary: 'The exported data for the person who asked, for 7 days (RN-183)', responses: { '200': { description: The data }, '409': { description: Not ready or expired } } }
  /api/v1/privacy/privacy/holds:
    get: { summary: Legal holds, responses: { '200': { description: Holds } } }
    post: { summary: Place a hold, responses: { '201': { description: Placed } } }
  /api/v1/privacy/privacy/retention-rules:
    get: { summary: Data categories and their retention per campus, responses: { '200': { description: Rules } } }
    put: { summary: Replace the rules, parameters: [{ $ref: '#/components/parameters/IfMatch' }], responses: { '200': { description: Replaced } } }
  /api/v1/privacy/policies:
    get: { summary: 'The policies of the campus of the caller in their latest version, with when the caller accepted each', responses: { '200': { description: Policies } } }
    post: { summary: 'Publish a version of a policy (privacy.policy.manage); the first use of a code creates the policy', responses: { '201': { description: Published } } }
  /api/v1/privacy/policies/pending:
    get: { summary: The policies whose latest version the caller has not accepted, responses: { '200': { description: Policies } } }
  /api/v1/privacy/policies/{code}/acceptance:
    post: { summary: 'Accept the latest version of a policy; accepting again changes nothing', responses: { '200': { description: Accepted }, '409': { description: The version is no longer the latest } } }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    After: { name: after, in: query, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
