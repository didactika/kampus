openapi: 3.1.0
info:
  title: Kampus progress API (design fragment)
  version: 0.1.0
  description: >-
    Progress rules, activity progress, progress exceptions, course criteria, prerequisites and course
    progress. States are shown as the requester may see them (RN-115). Conventions of DEC-025 and DEC-026.
paths:
  /api/v1/progress/course-modules/{course_module_id}/rules:
    get: { summary: What a course module requires, responses: { '200': { description: Rules } } }
    put: { summary: 'Replace the rules (progress.manage); a job re-evaluates the people who did something (RN-118)', responses: { '200': { description: Replaced } } }
  /api/v1/progress/course-modules/{course_module_id}/views:
    post: { summary: The caller opened the course module, responses: { '200': { description: The state of the caller } } }
  /api/v1/progress/course-modules/{course_module_id}/mark:
    put: { summary: Mark done when the course module asks for a mark (progress.mark_own), responses: { '200': { description: Marked }, '422': { description: The course module asks for no mark } } }
    delete: { summary: Take the mark back, responses: { '200': { description: Unmarked } } }
  /api/v1/progress/course-modules/{course_module_id}/states/{account_id}:
    get: { summary: The state of a person as the caller may see it (RN-115), responses: { '200': { description: State } } }
  /api/v1/progress/course-modules/{course_module_id}/exceptions:
    get: { summary: The decisions of teachers about a course module, responses: { '200': { description: Exceptions } } }
  /api/v1/progress/course-modules/{course_module_id}/exceptions/{account_id}:
    put: { summary: 'Decide a state with a reason (RN-119)', responses: { '200': { description: Decided } } }
    delete: { summary: Remove the decision; the rules apply again, responses: { '204': { description: Removed } } }
  /api/v1/progress/courses/{course_id}/states/{account_id}:
    get: { summary: The states of a person in a course as the caller may see them, responses: { '200': { description: States } } }
  /api/v1/progress/courses/{course_id}/my-progress:
    get: { summary: The states of the caller in a course, responses: { '200': { description: States } } }
  /api/v1/progress/courses/{course_id}/criteria:
    get: { summary: 'What the course requires, with how the criteria combine and whether completion is final', responses: { '200': { description: Criteria } } }
    put: { summary: 'Replace the criteria (RN-120, progress.manage); a criterion that stays keeps its approvals, and everyone followed is evaluated again', responses: { '200': { description: Replaced }, '422': { description: 'A criterion that does not fit the course, or a course that would require itself' } } }
  /api/v1/progress/courses/{course_id}/prerequisites:
    get: { summary: The prerequisite graph around a course, responses: { '200': { description: Graph } } }
    put: { summary: 'Set prerequisites; a cycle is refused (RN-122)', responses: { '200': { description: Set }, '409': { description: Would create a cycle } } }
  /api/v1/progress/courses/{course_id}/course-progress:
    get: { summary: 'The course progress of everyone the course follows, with each criterion (progress.view_all)', responses: { '200': { description: Progress } } }
  /api/v1/progress/courses/{course_id}/course-progress/{account_id}:
    get: { summary: 'The course progress of a person, with each criterion', responses: { '200': { description: Progress } } }
  /api/v1/progress/courses/{course_id}/my-course-progress:
    get: { summary: 'The course progress of the caller, with each criterion', responses: { '200': { description: Progress } } }
  /api/v1/progress/criteria/{criterion_id}/approvals/{account_id}:
    put: { summary: 'Approve a person for a role approval criterion; only someone who holds that role in the course', responses: { '204': { description: Approved }, '403': { description: 'Without the role' } } }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    After: { name: after, in: query, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
