openapi: 3.1.0
info:
  title: Kampus files API (design fragment)
  version: 0.1.0
  description: >-
    One upload pipeline (RN-129), file metadata and short-lived signed URLs (RN-131). A file is readable
    when its owner is readable (RN-128). Conventions of DEC-025 and DEC-026.
paths:
  /api/v1/files/uploads:
    post: { summary: 'Open an upload into an area for a scope (area, scope, name, size, media_type as a hint); needs the upload permission of the area there (RN-129)', responses: { '201': { description: 'The upload, valid for an hour' }, '403': { description: Without the permission }, '404': { description: Unknown area }, '422': { description: 'Name or size the area does not accept (files.upload_invalid)' } } }
  /api/v1/files/uploads/{upload_id}:
    put: { summary: 'Send the content as the raw body; the type is read from the content and checked against the area, and the content stored once by its hash (RN-126, RN-130)', responses: { '200': { description: Received }, '404': { description: Not your upload }, '409': { description: Expired or completed }, '422': { description: 'Too large or a type the area does not accept (files.too_large, files.type_not_allowed)' } } }
    post: { summary: 'Complete the upload into a file, which waits for its owner to attach it; until then only the uploader reads it', responses: { '201': { description: File }, '409': { description: 'No content yet, expired or completed' } } }
  /api/v1/files/files/{file_id}:
    get: { summary: 'File metadata, when the caller may read its owner (RN-128)', responses: { '200': { description: Metadata }, '404': { description: Not found or not readable } } }
  /api/v1/files/files/{file_id}/url:
    post: { summary: 'A link that reads this file for 5 minutes, served by the API; links signed by the store wait for a setting of its public address (RN-131)', responses: { '200': { description: URL and expiry }, '404': { description: Not found or not readable } } }
  /api/v1/files/content/{file_id}:
    get: { summary: 'The content behind a signed link, without signing in: nosniff, a sandboxing content security policy, and an attachment for content that could run (RN-132)', parameters: [{ name: expires, in: query, required: true, schema: { type: integer } }, { name: signature, in: query, required: true, schema: { type: string } }], responses: { '200': { description: Content }, '404': { description: 'Link changed or expired (files.link_invalid)' } } }
  /api/v1/files/files/{file_id}/conversions/{kind}:
    get: { summary: State or result of a conversion (RN-135), responses: { '200': { description: Conversion }, '202': { description: Queued } } }
  /api/v1/files/scopes/{scope_id}/quota:
    get: { summary: 'The limit of a scope and what its attached files take, counting the scopes inside it; needs files.quota.manage there', responses: { '200': { description: Quota } } }
    put: { summary: 'Set or lift (null) the limit in bytes (RN-134)', responses: { '200': { description: Quota }, '422': { description: 'A negative limit (files.quota_invalid)' } } }
  /api/v1/files/people/{principal_id}/quota:
    get: { summary: 'The limit of a person and what the attached files they uploaded take; needs files.quota.manage in their campus', responses: { '200': { description: Quota } } }
    put: { summary: Set or lift the limit of a person, responses: { '200': { description: Quota } } }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    After: { name: after, in: query, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
