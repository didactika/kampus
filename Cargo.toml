[workspace]
resolver = "3"
members = ["crates/*", "crates/*/adapters/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/didactika/kampus"
publish = false

[workspace.dependencies]
kampus-macros = { path = "crates/macros" }
kampus-common = { path = "crates/common" }
kampus-db = { path = "crates/db" }
kampus-module = { path = "crates/module" }
kampus-storage = { path = "crates/storage" }
kampus-cache = { path = "crates/cache" }
kampus-mail = { path = "crates/mail" }
kampus-push = { path = "crates/push" }
kampus-scan = { path = "crates/scan" }
kampus-access = { path = "crates/access" }
ammonia = "4.2.5"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
async-trait = "0.1.92"
bytes = "1.12.2"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
moka = { version = "0.12.16", features = ["future"] }
opendal = { version = "0.59.5", default-features = false, features = ["executors-tokio", "http-transport-reqwest", "layers-retry", "layers-timeout"] }
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
tempfile = "3.27.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.23.1"
aes-gcm = "0.11.1"
hkdf = "0.13.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha1 = { version = "0.11.0", default-features = false }
clap = { version = "4.6.8", features = ["derive", "env"] }
http-body-util = "0.1.5"
rpassword = "7.5.5"
semver = "1.0.28"
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "json", "rust_decimal"] }
rust_decimal = { version = "1.37.2", default-features = false, features = ["std", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
debug = false
