name: kampus-docs-check

services:
  plantuml:
    image: plantuml/plantuml-server:jetty

  check:
    image: node:24-slim
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    depends_on:
      - plantuml
    environment:
      PLANTUML_URL: http://plantuml:8080
    command: ["node", "tools/docs-check/wait-and-check.mjs"]

  openapi:
    image: redocly/cli:1.25.0
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    entrypoint: ["sh", "-c", "redocly lint --extends=minimal --format=summary docs/03-design/api/*.openapi.yaml"]

  repo:
    image: node:24-slim
    working_dir: /repo
    volumes:
      - ../..:/repo
    entrypoint: ["node", "tools/repo-check/check.mjs"]
