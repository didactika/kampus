name: kampus

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kampus
      POSTGRES_PASSWORD: kampus
      POSTGRES_DB: kampus
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tools/dev/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus -d kampus"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    image: kampus:0.1.0-dev
    ports:
      - "8100:8080"
    environment:
      KAMPUS_ROLE: all
      KAMPUS_PUBLIC_URL: http://localhost:8100
      KAMPUS_DATABASE_URL: postgres://kampus:kampus@postgres:5432/kampus
      KAMPUS_UPGRADE_ON_START: "true"
      KAMPUS_LOG_FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  rust:
    build: tools/dev
    image: kampus-dev:1.100.0
    working_dir: /work
    environment:
      KAMPUS_TEST_DATABASE_URL: postgres://kampus:kampus@postgres:5432/kampus_test
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/target
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  cargo-registry:
  cargo-git:
  target:
