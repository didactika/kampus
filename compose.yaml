name: kampus

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kampus
      POSTGRES_PASSWORD: kampus
      POSTGRES_DB: kampus
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus -d kampus"]
      interval: 2s
      timeout: 3s
      retries: 30

  rust:
    build: tools/dev
    image: kampus-dev:1.100.0
    working_dir: /work
    environment:
      KAMPUS_TEST_DATABASE_URL: postgres://kampus:kampus@postgres:5432/kampus
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/target
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  cargo-registry:
  cargo-git:
  target:
