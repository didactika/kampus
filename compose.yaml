name: kampus

services:
  postgres:
    image: postgres:17
    shm_size: 512mb
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: kampus
      POSTGRES_PASSWORD: kampus
      POSTGRES_DB: kampus
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tools/dev/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus -d kampus"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-dir=/data", "-master.volumeSizeLimitMB=64"]
    ports:
      - "58333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3-buckets:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "-c"]
    command:
      - for bucket in kampus kampus-test; do code=$$(curl -s -o /dev/null -w "%{http_code}" -X PUT http://s3:8333/$$bucket); [ "$$code" = 200 ] || [ "$$code" = 409 ] || exit 1; done
    depends_on:
      s3:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1.1
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    image: kampus:0.1.0-dev
    ports:
      - "8100:8080"
    environment:
      KAMPUS_SERVER_ROLE: all
      KAMPUS_SITE_URL: http://localhost:8100
      KAMPUS_DATABASE_URL: postgres://kampus:kampus@postgres:5432/kampus
      KAMPUS_SERVER_UPGRADE_ON_START: "true"
      KAMPUS_SECURITY_SECRET_KEY: a2FtcHVzIGRldmVsb3BtZW50IGtleSwgbm90IHJlYWw
      KAMPUS_ADMIN_EMAIL: admin@kampus.localhost
      KAMPUS_ADMIN_USERNAME: admin
      KAMPUS_ADMIN_PASSWORD: kampus development password
      KAMPUS_LOG_FORMAT: text
      KAMPUS_STORAGE_URL: s3://kampus/files
      KAMPUS_STORAGE_S3_ENDPOINT: http://s3:8333
      KAMPUS_STORAGE_S3_ACCESS_KEY_ID: kampus
      KAMPUS_STORAGE_S3_SECRET_ACCESS_KEY: kampus-secret
      KAMPUS_STORAGE_PUBLIC_URL: http://localhost:58333
      KAMPUS_CACHE_URL: valkey://valkey:6379
      KAMPUS_MAIL_URL: smtp://mailpit:1025
      KAMPUS_MAIL_FROM: Kampus <no-reply@kampus.localhost>
      KAMPUS_PUSH_URL: webpush://
      KAMPUS_PUSH_VAPID_PRIVATE_KEY: 0cjUJi8oxW5u35bVxdcOpNVkvZizjscMXLEY-QSpcR0
      KAMPUS_PUSH_SUBJECT: mailto:admin@kampus.localhost
    depends_on:
      postgres:
        condition: service_healthy
      s3-buckets:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: kampus-web:0.1.0-dev
    ports:
      - "8101:80"
    depends_on:
      server:
        condition: service_healthy

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "58080:8080"
    environment:
      JSON_CONFIG_PATH: /config/oidc.json
    volumes:
      - ./tools/dev/oidc/config.json:/config/oidc.json:ro

  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "58025:8025"

  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["scan"]
    ports:
      - "53310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s

  rust:
    build: tools/dev
    image: kampus-dev:1.100.0
    working_dir: /work
    environment:
      KAMPUS_TEST_DATABASE_URL: postgres://kampus:kampus@postgres:5432/kampus_test
      KAMPUS_TEST_S3_ENDPOINT: http://s3:8333
      KAMPUS_TEST_CACHE_URL: redis://valkey:6379
      KAMPUS_TEST_OIDC_URL: http://oidc:8080
      KAMPUS_TEST_SMTP_URL: smtp://mailpit:1025
      KAMPUS_TEST_MAILPIT_URL: http://mailpit:8025
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/target
    depends_on:
      postgres:
        condition: service_healthy
      s3-buckets:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      oidc:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  s3-data:
  cargo-registry:
  cargo-git:
  target:
