{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "kampus.labels" . | nindent 4 }}
type: Opaque
stringData:
  KAMPUS_DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  KAMPUS_SECURITY_SECRET_KEY: {{ required "secrets.secretKey is required (kampus-server secret-key)" .Values.secrets.secretKey | quote }}
  KAMPUS_ADMIN_EMAIL: {{ required "secrets.adminEmail is required" .Values.secrets.adminEmail | quote }}
  KAMPUS_ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  KAMPUS_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  {{- with .Values.secrets.storageS3AccessKeyId }}
  KAMPUS_STORAGE_S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.storageS3SecretAccessKey }}
  KAMPUS_STORAGE_S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mailUrl }}
  KAMPUS_MAIL_URL: {{ . | quote }}
  {{- end }}
{{- end }}
