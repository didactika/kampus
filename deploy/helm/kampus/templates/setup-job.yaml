# Installs on an empty database and applies the pending upgrades; one Job per revision of the release, which the
# Kampus pods wait for (their init container runs `kampus-server check` until the database matches the build).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-setup-{{ .Release.Revision }}
  labels:
    {{- include "kampus.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "kampus.labels" . | nindent 8 }}
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: setup
          image: {{ include "kampus.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "kampus-server install --non-interactive && kampus-server upgrade"]
          env:
            {{- include "kampus.env" . | nindent 12 }}
          envFrom:
            {{- include "kampus.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/kampus }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
