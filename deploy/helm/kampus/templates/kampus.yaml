{{- range $role, $spec := .Values.roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    {{- include "kampus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $spec.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "kampus.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Waits until the setup Job of this revision has brought the database to the build.
        - name: wait-for-setup
          image: {{ include "kampus.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "-c", "until kampus-server check; do sleep 5; done"]
          env:
            {{- include "kampus.env" $ | nindent 12 }}
          envFrom:
            {{- include "kampus.envFrom" $ | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
      containers:
        - name: kampus
          image: {{ include "kampus.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: KAMPUS_SERVER_ROLE
              value: {{ $role }}
            {{- include "kampus.env" $ | nindent 12 }}
          envFrom:
            {{- include "kampus.envFrom" $ | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $spec.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
