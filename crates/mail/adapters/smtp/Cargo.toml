[package]
name = "kampus-mail-smtp"
description = "Mail adapter of Kampus for SMTP servers, in the clear, with STARTTLS or over TLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kampus]
kind = "adapter"

[dependencies]
kampus-mail.workspace = true
kampus-common.workspace = true
async-trait.workspace = true
lettre.workspace = true

[dev-dependencies]
kampus-mail = { workspace = true, features = ["conformance"] }
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
