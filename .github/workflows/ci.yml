name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**', 'support/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  repository:
    name: Headers, version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: List the files and the changes of the pull request
        run: |
          git ls-files > "$RUNNER_TEMP/files.txt"
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi

      - name: Check the repository
        run: >-
          node tools/repo-check/check.mjs
          --files "$RUNNER_TEMP/files.txt"
          $([ -n "${{ github.base_ref }}" ] && echo --changed "$RUNNER_TEMP/changed.txt")

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests against PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kampus
          POSTGRES_PASSWORD: kampus
          POSTGRES_DB: kampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kampus -d kampus"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KAMPUS_TEST_DATABASE_URL: postgres://kampus:kampus@127.0.0.1:5432/kampus
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --locked

  supply-chain:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0,cargo-audit@0.22.2
      - run: cargo deny --all-features check
      - run: cargo audit
